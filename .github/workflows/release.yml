name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to resume
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  # Publishing crates and releases is intentionally non-cancellable. A newer
  # tag must not interrupt an irreversible publication already in progress.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source and packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-validation-v1

      - name: Validate tag, version, and release branch
        shell: bash
        run: |
          scripts/check-release-version.sh "$RELEASE_TAG"

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "Release tag $RELEASE_TAG is not contained in origin/master." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check published crate license copies
        run: scripts/check-license-copies.sh

      - name: Check safe application boundary
        run: scripts/check-plugin-boundary.sh

      - name: Check plugin macro compile fixtures
        run: scripts/check-plugin-macro-fixtures.sh

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build and inspect publishable crate packages
        run: scripts/check-crate-packages.sh

  miri:
    name: Release Miri (${{ matrix.package }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: scs-sdk
            miri_flags: ''
          - package: scs-sdk-plugin
            miri_flags: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Miri toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-12
          components: miri, rust-src

      - name: Cache Miri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-miri-${{ matrix.package }}-v1

      - name: Run Miri
        env:
          MIRIFLAGS: ${{ matrix.miri_flags }}
        run: cargo +nightly-2026-04-12 miri test --locked -p ${{ matrix.package }}

  build-windows:
    name: Build Windows x86-64 release archive
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64

      - name: Cache Windows build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86-64-v1

      - name: Build, verify, and package examples
        run: scripts/package-release-artifact.sh windows "$RELEASE_TAG" dist

      - name: Build and verify independent macro fixture
        run: scripts/build-windows-plugin-macro-fixture.sh

      - name: Upload Windows release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86-64
          path: dist/scs-sdk-crates-${{ env.RELEASE_TAG }}-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x86-64 release archive
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup pinned Zig toolchain
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install pinned cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Cache Linux build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-x86-64-glibc-2.17-v1

      - name: Build, verify, and package examples
        run: scripts/package-release-artifact.sh linux "$RELEASE_TAG" dist

      - name: Build and verify independent macro fixture
        run: scripts/build-linux-plugin-macro-fixture.sh

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86-64-glibc-2.17
          path: dist/scs-sdk-crates-${{ env.RELEASE_TAG }}-linux-x86_64-glibc-2.17.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS x86-64 release archive
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-apple-darwin

      - name: Cache macOS build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-x86-64-v1

      - name: Build, verify, and package examples
        run: scripts/package-release-artifact.sh macos "$RELEASE_TAG" dist

      - name: Build and verify independent macro fixture
        run: scripts/build-macos-plugin-macro-fixture.sh

      - name: Upload macOS release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-x86-64
          path: dist/scs-sdk-crates-${{ env.RELEASE_TAG }}-macos-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-crates:
    name: Publish crates.io packages
    needs:
      - miri
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Publish missing crate versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  github-release:
    name: Sign and publish GitHub Release
    needs: publish-crates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      # A manual resume loads the workflow definition from the default branch
      # while the release source remains pinned to the immutable tag above.
      # Keep current workflow-only helpers separately so recovery fixes do not
      # require moving a tag whose crates may already have been published.
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          path: .release-workflow
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify platform archive set
        run: >-
          .release-workflow/scripts/verify-release-assets.sh
          release-assets "$RELEASE_TAG" archives

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Generate and sign checksums
        shell: bash
        run: |
          (
            cd release-assets
            sha256sum \
              "scs-sdk-crates-$RELEASE_TAG-linux-x86_64-glibc-2.17.tar.gz" \
              "scs-sdk-crates-$RELEASE_TAG-macos-x86_64.tar.gz" \
              "scs-sdk-crates-$RELEASE_TAG-windows-x86_64.zip" \
              > checksums.txt
          )

          cosign sign-blob --yes \
            --bundle release-assets/checksums.txt.sigstore.json \
            release-assets/checksums.txt

      - name: Verify generated signature and complete asset set
        shell: bash
        run: |
          workflow_identity="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign verify-blob release-assets/checksums.txt \
            --bundle release-assets/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$workflow_identity"

          .release-workflow/scripts/verify-release-assets.sh \
            release-assets "$RELEASE_TAG" complete

      - name: Generate release notes and body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$(git rev-list -n 1 "$RELEASE_TAG")" \
            --jq .body > generated-notes.md

          RELEASE_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            COSIGN_CERTIFICATE_IDENTITY="https://github.com/$GITHUB_WORKFLOW_REF" \
            .release-workflow/scripts/generate-release-body.sh \
              "$RELEASE_TAG" generated-notes.md release-body.md

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=(--draft --verify-tag)
          prerelease=false
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            prerelease=true
            release_flags+=(--prerelease --latest=false)
          fi

          if release_json="$(
            .release-workflow/scripts/find-github-release.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          )"; then
            if [[ "$(jq -r .draft <<<"$release_json")" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists and is not a draft." >&2
              exit 1
            fi

            release_id="$(jq -r .id <<<"$release_json")"
            jq -n \
              --arg name "SCS SDK Rust Crates $RELEASE_TAG" \
              --rawfile body release-body.md \
              --argjson prerelease "$prerelease" \
              '{
                name: $name,
                body: $body,
                draft: true,
                prerelease: $prerelease
              }' \
              | gh api --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  --input - >/dev/null
          else
            find_status=$?
            if [[ "$find_status" -ne 3 ]]; then
              exit "$find_status"
            fi

            gh release create "$RELEASE_TAG" \
              --title "SCS SDK Rust Crates $RELEASE_TAG" \
              --notes-file release-body.md \
              "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Verify remote assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          expected_assets="$(mktemp)"
          remote_assets="$(mktemp)"
          find release-assets -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort >"$expected_assets"

          release_json="$(
            .release-workflow/scripts/find-github-release.sh --wait \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          )"
          if [[ "$(jq -r .draft <<<"$release_json")" != "true" ]]; then
            echo "Release $RELEASE_TAG is no longer a draft." >&2
            exit 1
          fi
          jq -r '.assets[].name' <<<"$release_json" \
            | LC_ALL=C sort >"$remote_assets"
          diff -u "$expected_assets" "$remote_assets"

          release_id="$(jq -r .id <<<"$release_json")"
          prerelease=false
          make_latest=true
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then
            prerelease=true
            make_latest=false
          fi

          published_release="$(mktemp)"
          jq -n \
            --argjson prerelease "$prerelease" \
            --arg make_latest "$make_latest" \
            '{
              draft: false,
              prerelease: $prerelease,
              make_latest: $make_latest
            }' \
            | gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --input - >"$published_release"

          if ! jq -e \
            --argjson prerelease "$prerelease" \
            '.draft == false and .prerelease == $prerelease' \
            "$published_release" >/dev/null; then
            echo "GitHub returned an unexpected published release state." >&2
            cat "$published_release" >&2
            exit 1
          fi
