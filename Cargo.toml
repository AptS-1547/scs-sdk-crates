[workspace]
members = [
  "crates/scs-sdk",
  "crates/scs-sdk-plugin",
  "crates/scs-sdk-plugin-macros",
  "crates/scs-sdk-sys",
  "examples/input-plugin",
  "examples/input-semantical-plugin",
  "examples/telemetry-fallback-plugin",
  "examples/telemetry-plugin",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AptS-1547/scs-sdk-crates"
homepage = "https://github.com/AptS-1547/scs-sdk-crates"

[workspace.dependencies]
# Public workspace crates use exact synchronized versions. Cargo keeps the
# local path during workspace development and publishes the version requirement
# so crates.io consumers cannot accidentally combine incompatible releases.
scs-sdk = { path = "crates/scs-sdk", version = "=0.1.1" }
scs-sdk-plugin = { path = "crates/scs-sdk-plugin", version = "=0.1.1" }
scs-sdk-plugin-macros = { path = "crates/scs-sdk-plugin-macros", version = "=0.1.1" }
scs-sdk-sys = { path = "crates/scs-sdk-sys", version = "=0.1.1" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
